<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 880" role="img" aria-labelledby="title desc">
  <title id="title">SafeStack public repository architecture map</title>
  <desc id="desc">A scatter plot showing all 20 public SafeStack repositories by architectural exposure surface and system layer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061329"/><stop offset="1" stop-color="#132b4a"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <rect width="1400" height="880" rx="28" fill="url(#bg)"/>
  <circle cx="1210" cy="120" r="170" fill="#6d5dfc" opacity=".16" filter="url(#soft)"/>
  <circle cx="260" cy="740" r="160" fill="#43e6d2" opacity=".10" filter="url(#soft)"/>
  <text x="70" y="74" fill="#43e6d2" font-family="Arial,Helvetica,sans-serif" font-size="18" letter-spacing="5">SAFESTACK / ORGANISATION MAP</text>
  <text x="70" y="122" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="700">Public repository architecture</text>
  <text x="1330" y="82" fill="#a9bddd" font-family="Arial,Helvetica,sans-serif" font-size="14" text-anchor="end">SNAPSHOT · 2026-11-06 · 20 PUBLIC REPOSITORIES</text>

  <g opacity=".22" stroke="#9fb5d9" stroke-width="1">
    <path d="M170 170H1280M170 300H1280M170 430H1280M170 560H1280M170 690H1280"/>
    <path d="M170 170V690M392 170V690M614 170V690M836 170V690M1058 170V690M1280 170V690"/>
  </g>
  <g stroke="#8ea9cf" stroke-width="2">
    <path d="M170 690H1280"/><path d="M170 690V170"/>
  </g>
  <g fill="#a9bddd" font-family="Arial,Helvetica,sans-serif" font-size="14">
    <text x="170" y="730" text-anchor="middle">FOUNDATION CORE</text>
    <text x="1280" y="730" text-anchor="middle">PUBLIC EDGE</text>
    <text x="725" y="770" text-anchor="middle" letter-spacing="3">ARCHITECTURAL EXPOSURE SURFACE  →</text>
    <text x="135" y="690" text-anchor="end">ROOT ANCHOR</text>
    <text x="135" y="175" text-anchor="end">USER INTERFACE</text>
    <text x="95" y="440" text-anchor="middle" transform="rotate(-90 95 440)" letter-spacing="3">SYSTEM ROLE / LAYER  →</text>
  </g>

  <!-- 1. trust and registry (6 repos) -->
  <g fill="#6d5dfc" stroke="#d9d5ff" stroke-width="2" font-family="Arial,Helvetica,sans-serif" font-size="12">
    <circle cx="280" cy="650" r="11" fill="#6b7180"/><text x="298" y="654" fill="#c1cad9" stroke="none">canon (archived)</text>
    <circle cx="455" cy="610" r="11"/><text x="473" y="614" fill="#fff" stroke="none">technical-canon</text>
    <circle cx="635" cy="635" r="11"/><text x="653" y="639" fill="#fff" stroke="none">public-keys</text>
    <circle cx="785" cy="585" r="11"/><text x="803" y="589" fill="#fff" stroke="none">validation-registry</text>
    <circle cx="945" cy="530" r="11"/><text x="963" y="534" fill="#fff" stroke="none">control-architecture</text>
    <circle cx="1095" cy="620" r="11"/><text x="1113" y="624" fill="#fff" stroke="none">verification-artifacts</text>
  </g>

  <!-- 2. runtime and infrastructure (4 repos) -->
  <g fill="#43e6d2" stroke="#d5fff8" stroke-width="2" font-family="Arial,Helvetica,sans-serif" font-size="12">
    <circle cx="555" cy="370" r="11"/><text x="573" y="374" fill="#fff" stroke="none">zero-trust</text>
    <circle cx="760" cy="310" r="11"/><text x="778" y="314" fill="#fff" stroke="none">ZT-platform</text>
    <circle cx="955" cy="360" r="11"/><text x="973" y="364" fill="#fff" stroke="none">sentinel</text>
    <circle cx="1130" cy="310" r="11"/><text x="1148" y="314" fill="#fff" stroke="none">suite</text>
  </g>

  <!-- 3. intelligence and automation (2 repos) -->
  <g fill="#ffb86b" stroke="#fff0d6" stroke-width="2" font-family="Arial,Helvetica,sans-serif" font-size="12">
    <circle cx="675" cy="445" r="11"/><text x="693" y="449" fill="#fff" stroke="none">audit_system</text>
    <circle cx="895" cy="410" r="11"/><text x="913" y="414" fill="#fff" stroke="none">OSINT</text>
  </g>

  <!-- 4. web and publishing (4 repos) -->
  <g fill="#9be15d" stroke="#efffdc" stroke-width="2" font-family="Arial,Helvetica,sans-serif" font-size="12">
    <circle cx="780" cy="215" r="11"/><text x="798" y="219" fill="#fff" stroke="none">safestack-book</text>
    <circle cx="950" cy="190" r="11"/><text x="968" y="194" fill="#fff" stroke="none">darbu-sauga</text>
    <circle cx="1055" cy="245" r="11"/><text x="1073" y="249" fill="#fff" stroke="none">.github</text>
    <circle cx="1150" cy="195" r="11"/><text x="1168" y="199" fill="#fff" stroke="none">freedom manifesto</text>
  </g>

  <!-- 5. ecosystem and meta (4 repos) -->
  <g fill="#ff4ecd" stroke="#ffd5f3" stroke-width="2" font-family="Arial,Helvetica,sans-serif" font-size="12">
    <circle cx="745" cy="510" r="11"/><text x="763" y="514" fill="#fff" stroke="none">repo-map</text>
    <circle cx="920" cy="475" r="11"/><text x="938" y="479" fill="#fff" stroke="none">partners</text>
    <circle cx="1135" cy="415" r="11"/><text x="1153" y="419" fill="#fff" stroke="none">media-library</text>
    <circle cx="1235" cy="360" r="11"/><text x="1253" y="364" fill="#fff" stroke="none">music</text>
  </g>

  <!-- legend -->
  <g transform="translate(70 815)" font-family="Arial,Helvetica,sans-serif" font-size="13">
    <circle cx="8" cy="0" r="7" fill="#6d5dfc"/><text x="24" y="5" fill="#c8d6ee">Trust (6)</text>
    <circle cx="115" cy="0" r="7" fill="#43e6d2"/><text x="131" y="5" fill="#c8d6ee">Runtime (4)</text>
    <circle cx="235" cy="0" r="7" fill="#ffb86b"/><text x="251" y="5" fill="#c8d6ee">Intelligence (2)</text>
    <circle cx="375" cy="0" r="7" fill="#9be15d"/><text x="391" y="5" fill="#c8d6ee">Web (4)</text>
    <circle cx="475" cy="0" r="7" fill="#ff4ecd"/><text x="491" y="5" fill="#c8d6ee">Ecosystem (4)</text>
    <text x="760" y="5" fill="#8ea9cf">All 20 public repositories displayed · Private &amp; internal repos excluded · Grey = archived</text>
  </g>
</svg>
